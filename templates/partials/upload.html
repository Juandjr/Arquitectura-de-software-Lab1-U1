<div class="wm-narrow">
    <section id="cargar-dataset" class="wm-card" aria-labelledby="t-datos">
        <div class="wm-card-head">
            <h2 id="t-datos" class="h5 mb-0">
                <i class="bi bi-cloud-arrow-up me-2"></i>Cargar datos
            </h2>
            <p class="mb-0 small wm-muted">
                Sube el archivo con las observaciones meteorológicas.
            </p>
        </div>
        <div class="wm-card-body">
            <form action="{{ url_for('train') }}" method="post" enctype="multipart/form-data"
                data-loading="Entrenando modelo…">
                <label class="dropzone" id="dropzone" for="dataset">
                    <i class="bi bi-file-earmark-spreadsheet dz-icon" id="dz-icon"></i>
                    <span class="dz-title" id="dz-title">Elige un archivo CSV o arrástralo aquí</span>
                    <span class="dz-sub" id="dz-sub">Solo se aceptan archivos .csv</span>
                    <input class="visually-hidden" id="dataset" type="file" name="dataset"
                        accept=".csv,text/csv" required />
                </label>

                <p class="small wm-muted mt-3 mb-0">
                    <i class="bi bi-info-circle me-1"></i>
                    El archivo necesita columnas con las características y una
                    columna objetivo con al menos dos clases. Se recomienda llamarla
                    <code>rain</code>.
                </p>

                <button class="btn btn-primary btn-lg w-100 mt-4" type="submit">
                    <i class="bi bi-play-fill me-1"></i>Entrenar y ver resultados
                </button>
            </form>
        </div>
    </section>
</div>
